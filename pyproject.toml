[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "causal_rust_core"
version = "0.1.0"
description = "Causal inference estimators in Rust with Python bindings"
authors = [{name = "Kinyua Seaman"}]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.0.0",
    "marimo>=0.8.0",
    "econml>=0.14.0",
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0",
    "joblib>=1.4.0",
]

[project.optional-dependencies]
gpu = ["scikit-learn-intelex>=2024.0"]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "causal_rust_core._causal_rust_core"

[dependency-groups]
dev = [
    "linearmodels>=7.1",
    "maturin>=1.16.0",
    "pytest>=9.2.0",
    "statsmodels>=0.15.0",
]
